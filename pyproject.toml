[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myst-tools"
version = "0.2.0"
description = "Herramientas unificadas para automatizar, formatear e indexar material didáctico MyST Markdown"
readme = "README.md"
authors = [
    { name = "Martín René", email = "martinvilu@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
myst-tools = "myst_tools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/myst_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myst-tools"
version = "0.2.0"
description = "Herramientas unificadas para automatizar, formatear e indexar material didáctico MyST Markdown"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/myst-tools"
Repository = "https://github.com/INGCOM-UNRN-P1/myst-tools.git"
Issues = "https://github.com/INGCOM-UNRN-P1/myst-tools/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
myst-tools = "myst_tools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/myst_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]